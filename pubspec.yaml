name: tinode
description: This SDK implements Tinode client-side protocol for multi platform applications based on dart.
version: 0.0.1
homepage: https://tinode.co/

environment:
  sdk: ^3.8.1
  flutter: ^3.32.0

dependencies:
  flutter:
    sdk: flutter
  rxdart: ^0.28.0
  web_socket_channel: ^3.0.3
  get_it: ^7.2.0
  json_annotation: ^4.9.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.10.0
  pedantic: ^1.11.0
  test: ^1.17.5
